# pnpm 10+ 工作区配置
# onlyBuiltDependencies：pnpm 10 早期版本的构建脚本允许列表
onlyBuiltDependencies:
  - electron
  - esbuild

# allowBuilds：pnpm 10.29+ / 11 的构建脚本最终授权（包名 → 是否允许执行 postinstall）
allowBuilds:
  electron: true
  esbuild: true
