appId: com.lingke.koring.launcher
productName: Koring Launcher
directories:
  output: dist-electron
  buildResources: build
files:
  - dist/**
  - electron/**/*.js
  - "!electron/**/*.ts"
win:
  target: nsis
  icon: build/icon.ico
  artifactName: "koring-launcher-${version}-setup.${ext}"
mac:
  target: dmg
  icon: build/icon.png
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerHeader: build/installer-header.png
  license: build/license.rtf
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Koring Launcher
  include: build/installer-custom.nsh
  script: build/installer-strings.nsh
  uninstallDisplayName: "卸载 Koring Launcher"
  displayLanguageSelector: true
  installerLanguages:
    - 2052
    - 1028
    - 1033
