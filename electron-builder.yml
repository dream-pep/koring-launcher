appId: com.lingke.koring.launcher
productName: Koring Launcher
directories:
  output: dist-electron
  buildResources: build
publish:
  provider: github
  owner: dream-pep
  repo: koring-launcher
compression: maximum
asar: true
files:
  - dist/**
  - electron-dist/**/*.js
# 主进程环境变量（Account API 地址 / 密钥等）：由 scripts/gen-env.js 按构建模式生成
# build/.env，复制为 resources/.env；运行时读取 <resources>/.env 与 <userData>/.env
# （现场覆盖），见 electron/core/env.ts
extraResources:
  - from: build/.env
    to: .env
win:
  target: nsis
  icon: build/icon.ico
  artifactName: "koring-launcher-${version}-setup.${ext}"
  requestedExecutionLevel: asInvoker
  # SignPath 远程签名：scripts/signpath-sign.js
  # 无 SIGNPATH_API_TOKEN 时自动跳过（本地构建不受影响）
  # signingHashAlgorithms 只保留 sha256：避免 electron-builder 对每个文件
  # 按 sha1+sha256 双算法各签一次（远程签名会重复消耗 SignPath 配额）
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    sign: scripts/signpath-sign.js
mac:
  # dmg 供手动安装；zip 供 electron-updater（Squirrel.Mac 只接受 zip，清单为 latest-mac.yml）
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.games
  # 显式带 arch：latest-mac.yml 中 arm64 / x64 两个 zip 靠文件名区分，MacUpdater 按本机架构挑包
  artifactName: "koring-launcher-${version}-mac-${arch}.${ext}"
  # ⚠️ 当前未签名：用户首次打开需右键 → 打开（或 xattr -cr）。
  # 启用签名 / 公证时取消下面注释，并配置 MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD /
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID（Secrets），
  # 同时新增 mac/entitlements.mac.plist（allow-jit / allow-unsigned-executable-memory）。
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlements: mac/entitlements.mac.plist
  # entitlementsInherit: mac/entitlements.mac.plist
  # notarize: true
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installer-header.bmp
  license: build/license.txt
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Koring Launcher
  include: build/installer-custom.nsh
  uninstallDisplayName: "Koring Launcher"
  deleteAppDataOnUninstall: false
  installerLanguages:
    - "zh_CN"
    - "zh_TW"
    - "en_US"
